<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Study Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
        }

        h2 {
            font-size: 2em;
        }
        p {
            font-size: 1.25em;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .sub-controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .category-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4267B2;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .category-btn:hover {
            background-color: #365899;
        }

        .flashcard {
            perspective: 1000px;
            width: 100%;
            height: 350px;
            padding: 10px;
            margin: 20px 0;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transform-origin: center right;
            transition: transform 0.5s;
        }

        .card.is-flipped {
            transform: translateX(-100%) rotateY(-180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-front {
            background-color: white;
        }

        .card-back {
            background-color: #e9ebee;
            transform: rotateY(180deg);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #42b72a;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: #36a420;
        }

        .counter {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <button class="category-btn" onclick="filterCategory('all')">All</button>
        <button class="category-btn" onclick="filterCategory('special-senses')">Special Senses</button>
        <button class="category-btn" onclick="filterCategory('endocrine')">Endocrine</button>
        <button class="category-btn" onclick="filterCategory('reproductive')">Reproductive</button>
    </div>

    <div class="sub-controls">
        <select id="subcategory-select" onchange="filterSubcategory()">
            <option value="all">All Subcategories</option>
        </select>
    </div>

    <div class="flashcard">
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front">
                <h2>Question</h2>
                <p id="question"></p>
            </div>
            <div class="card-face card-back">
                <h2>Answer</h2>
                <p id="answer"></p>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" onclick="previousCard()">Previous</button>
        <button class="nav-btn" onclick="nextCard()">Next</button>
    </div>

    <div class="counter">
        Card <span id="current">1</span> of <span id="total">0</span>
    </div>

    <div>
        <h2>Downloadable Files</h2>
        <p>
            <a href="./files/Special-Senses-Endocrine-Reproductive-Systems-Study-Guide.pdf" target="_blank">Special-Senses-Endocrine-Reproductive-Systems-Study-Guide</a>
        </p>
        <p>
            <a href="./files/Comprehensive-Study-Guide-V2.pdf" target="_blank">Comprehensive-Study-Guide-V2</a>
        </p>
        <p>
            <a href="./files/Practice-Test-1.pdf" target="_blank">Practice Test 1</a>&nbsp;&nbsp;
            <a href="./files/Practice-Test-1-Answers.pdf" target="_blank">Practice Test 1 Answers</a>
        </p>
        <p>
            <a href="./files/Practice-Test-2.pdf" target="_blank">Practice Test 2</a>&nbsp;&nbsp;
            <a href="./files/Practice-Test-2-Answers.pdf" target="_blank">Practice Test 2 Answers</a>
        </p>
    </div>
</div>

<script>

    let currentCategory = 'all';
    let currentCardIndex = 0;
    let filteredCards;
    let flashcards;
    const subcategorySelect = document.getElementById('subcategory-select');
    let isShuffled = false; // Track shuffle state

    fetchData().then(data => {
        flashcards = data;
        filteredCards = [...data];
        // Initial setup: Populate subcategories for 'all' categories
        filterCategory('all'); // Start with all categories and subcategories selected
        updateCard();
        updateCounter();
    });

    async function fetchData() {
        const response = await fetch('./flashcards.json');
        return await response.json();
    }

    function filterCategory(category) {
        currentCategory = category;
        updateSubcategories(); // Update subcategory options
        filterCards(); // Filter cards based on category and subcategory
    }

    function filterSubcategory() {
        filterCards();
    }

    function filterCards() {
        const selectedSubcategory = subcategorySelect.value;
        filteredCards = flashcards.filter(card =>
            (currentCategory === 'all' || card.category === currentCategory) &&
            (selectedSubcategory === 'all' || card.subcategory === selectedSubcategory)
        );
        currentCardIndex = 0;
        updateCard();
        updateCounter();
    }

    function updateSubcategories() {
        // Clear existing options
        subcategorySelect.innerHTML = '<option value="all">All Subcategories</option>';

        // Get unique subcategories for the current category
        const subcategories = new Set();
        flashcards.forEach(card => {
            if (currentCategory === 'all' || card.category === currentCategory) {
                subcategories.add(card.subcategory);
            }
        });

        // Add subcategories to the select element
        subcategories.forEach(subcategory => {
            const option = document.createElement('option');
            option.value = subcategory;
            option.text = subcategory;
            subcategorySelect.appendChild(option);
        });
    }

    function shuffleCards() {
        // Fisher-Yates shuffle algorithm
        for (let i = filteredCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
        }
        currentCardIndex = 0; // Reset to the first card after shuffling
        updateCard();
        updateCounter();
    }

    // Add shuffle button to controls
    const shuffleButton = document.createElement('button');
    shuffleButton.textContent = 'Shuffle';
    shuffleButton.className = 'category-btn'; // Use the same style as other buttons
    shuffleButton.onclick = () => {
        isShuffled = true; // Update shuffle state
        shuffleCards();
    };
    document.querySelector('.sub-controls').appendChild(shuffleButton);

    function flipCard(card) {
        card.classList.toggle('is-flipped');
    }

    function updateCard() {
        document.getElementById('question').textContent = filteredCards[currentCardIndex].question;
        document.getElementById('answer').innerHTML = filteredCards[currentCardIndex].answer;
        document.querySelector('.card').classList.remove('is-flipped');
    }

    function updateCounter() {
        document.getElementById('current').textContent = currentCardIndex + 1;
        document.getElementById('total').textContent = filteredCards.length;
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex + 1) % filteredCards.length;
        updateCard();
        updateCounter();
    }

    function previousCard() {
        currentCardIndex = (currentCardIndex - 1 + filteredCards.length) % filteredCards.length;
        updateCard();
        updateCounter();
    }

</script>
</body>
</html>
