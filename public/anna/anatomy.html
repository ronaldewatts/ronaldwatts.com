<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Study Flashcards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .category-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #4267B2;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .category-btn:hover {
            background-color: #365899;
        }

        .flashcard {
            perspective: 1000px;
            width: 100%;
            height: 300px;
            margin: 20px 0;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            transform-style: preserve-3d;
            transform-origin: center right;
            transition: transform 0.5s;
        }

        .card.is-flipped {
            transform: translateX(-100%) rotateY(-180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-front {
            background-color: white;
        }

        .card-back {
            background-color: #e9ebee;
            transform: rotateY(180deg);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #42b72a;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: #36a420;
        }

        .counter {
            text-align: center;
            margin-top: 10px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="controls">
        <button class="category-btn" onclick="filterCategory('all')">All</button>
        <button class="category-btn" onclick="filterCategory('special-senses')">Special Senses</button>
        <button class="category-btn" onclick="filterCategory('endocrine')">Endocrine</button>
        <button class="category-btn" onclick="filterCategory('reproductive')">Reproductive</button>
    </div>

    <div class="flashcard">
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front">
                <h2>Question</h2>
                <p id="question"></p>
            </div>
            <div class="card-face card-back">
                <h2>Answer</h2>
                <p id="answer"></p>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" onclick="previousCard()">Previous</button>
        <button class="nav-btn" onclick="nextCard()">Next</button>
    </div>

    <div class="counter">
        Card <span id="current">1</span> of <span id="total">0</span>
    </div>
</div>

<script>
    const flashcards = [
// SPECIAL SENSES - VISION
        {
            category: 'special-senses',
            subcategory: 'vision',
            question: "What are the three layers of the eye?",
            answer: "1. Fibrous tunic (sclera, cornea)\n2. Vascular tunic (choroid, ciliary body, iris)\n3. Neural tunic (retina)"
        },
        {
            category: 'special-senses',
            subcategory: 'vision',
            question: "Compare rods and cones.",
            answer: "RODS:\n- Dim light vision\n- Black and white\n- More sensitive\n- Peripheral vision\n\nCONES:\n- Bright light vision\n- Color vision\n- Less sensitive\n- Central vision"
        },
        {
            category: 'special-senses',
            subcategory: 'vision',
            question: "What is the function of the macula lutea and fovea centralis?",
            answer: "Macula lutea: Region of high visual acuity\nFovea centralis: Center of macula, highest concentration of cones, sharpest vision"
        },
        {
            category: 'special-senses',
            subcategory: 'vision',
            question: "Describe the visual pathway from cornea to brain.",
            answer: "1. Cornea\n2. Anterior chamber\n3. Lens\n4. Vitreous humor\n5. Retina\n6. Optic nerve\n7. Optic chiasm\n8. Visual cortex"
        },

// SPECIAL SENSES - HEARING
        {
            category: 'special-senses',
            subcategory: 'hearing',
            question: "Name the three regions of the ear and their components.",
            answer: "1. External ear: pinna, external auditory canal, tympanic membrane\n2. Middle ear: ossicles (malleus, incus, stapes), Eustachian tube\n3. Inner ear: cochlea, semicircular canals, vestibule"
        },
        {
            category: 'special-senses',
            subcategory: 'hearing',
            question: "Describe the process of sound transmission through the ear.",
            answer: "1. Sound waves enter external ear\n2. Tympanic membrane vibrates\n3. Ossicles amplify vibrations\n4. Oval window receives vibrations\n5. Fluid in cochlea moves\n6. Hair cells stimulated\n7. Auditory nerve activated"
        },

// SPECIAL SENSES - EQUILIBRIUM
        {
            category: 'special-senses',
            subcategory: 'equilibrium',
            question: "What's the difference between static and dynamic equilibrium?",
            answer: "Static equilibrium: Detected by utricle and saccule; senses linear acceleration and head position\n\nDynamic equilibrium: Detected by semicircular canals; senses rotational movement"
        },

// SPECIAL SENSES - TASTE
        {
            category: 'special-senses',
            subcategory: 'taste',
            question: "Describe the four types of papillae and their functions.",
            answer: "1. Circumvallate: Large, V-shape at back, 100-300 taste buds\n2. Fungiform: Scattered, ~5 taste buds each\n3. Foliate: Sides of tongue, degenerate in childhood\n4. Filiform: No taste buds, increase friction"
        },
        {
            category: 'special-senses',
            subcategory: 'taste',
            question: "How do different tastes activate taste receptors?",
            answer: "Salty & Sour: Ion channels\nSweet, Bitter, Umami: G-protein coupled receptors"
        },

// ENDOCRINE - GENERAL CONCEPTS
        {
            category: 'endocrine',
            subcategory: 'general',
            question: "Compare endocrine and nervous system communication.",
            answer: "ENDOCRINE:\n- Uses hormones\n- Slower response\n- Longer-lasting effects\n- Widespread effects\n\nNERVOUS:\n- Uses neurotransmitters\n- Rapid response\n- Brief effects\n- Localized effects"
        },
        {
            category: 'endocrine',
            subcategory: 'general',
            question: "Compare lipid-soluble and water-soluble hormones.",
            answer: "LIPID-SOLUBLE:\n- Pass through membrane\n- Internal receptors\n- Affect gene transcription\n- Example: steroids\n\nWATER-SOLUBLE:\n- Bind surface receptors\n- Use second messengers\n- Example: peptide hormones"
        },

// ENDOCRINE - HYPOTHALAMUS & PITUITARY
        {
            category: 'endocrine',
            subcategory: 'pituitary',
            question: "List the anterior pituitary hormones and their functions.",
            answer: "1. GH: Growth promotion\n2. TSH: Thyroid stimulation\n3. ACTH: Adrenal stimulation\n4. FSH: Gamete production\n5. LH: Hormone production\n6. Prolactin: Milk production"
        },
        {
            category: 'endocrine',
            subcategory: 'pituitary',
            question: "What are the posterior pituitary hormones and their functions?",
            answer: "1. ADH (Vasopressin): Water retention\n2. Oxytocin: Uterine contractions, milk ejection"
        },

// ENDOCRINE - THYROID
        {
            category: 'endocrine',
            subcategory: 'thyroid',
            question: "What are the effects of thyroid hormones (T3/T4)?",
            answer: "1. Increase metabolic rate\n2. Regulate growth and development\n3. Influence protein synthesis\n4. Affect heart rate\n5. Influence temperature regulation"
        },
        {
            category: 'endocrine',
            subcategory: 'thyroid',
            question: "Describe thyroid hormone regulation (negative feedback).",
            answer: "1. Low T3/T4 → Hypothalamus releases TRH\n2. TRH → Anterior pituitary releases TSH\n3. TSH → Thyroid releases T3/T4\n4. High T3/T4 → Inhibits TRH and TSH"
        },

// ENDOCRINE - ADRENAL GLANDS
        {
            category: 'endocrine',
            subcategory: 'adrenal',
            question: "What hormones are produced by the adrenal medulla and their effects?",
            answer: "1. Epinephrine (80%)\n2. Norepinephrine (20%)\n\nEffects:\n- ↑ Heart rate\n- ↑ Blood pressure\n- ↑ Blood glucose\n- ↑ Respiratory rate"
        },
        {
            category: 'endocrine',
            subcategory: 'adrenal',
            question: "What are the functions of cortisol?",
            answer: "1. Increases blood glucose\n2. Suppresses immune system\n3. Anti-inflammatory effects\n4. Aids in stress response\n5. Affects protein metabolism"
        },

// REPRODUCTIVE - MALE
        {
            category: 'reproductive',
            subcategory: 'male',
            question: "Describe the stages of spermatogenesis.",
            answer: "1. Spermatogonia (mitosis)\n2. Primary spermatocyte (meiosis I)\n3. Secondary spermatocyte\n4. Spermatids (meiosis II)\n5. Mature sperm"
        },
        {
            category: 'reproductive',
            subcategory: 'male',
            question: "What are the functions of testosterone?",
            answer: "1. Development of male sex characteristics\n2. Sperm production\n3. Muscle and bone mass maintenance\n4. Sex drive\n5. Body hair growth"
        },

// REPRODUCTIVE - FEMALE
        {
            category: 'reproductive',
            subcategory: 'female',
            question: "Describe the events of the menstrual cycle by phase.",
            answer: "MENSTRUAL (1-5):\n- Endometrium shed\n\nFOLLICULAR (6-13):\n- Follicle develops\n- Estrogen rises\n\nOVULATION (14):\n- LH surge\n- Egg release\n\nLUTEAL (15-28):\n- Corpus luteum forms\n- Progesterone rises"
        },
        {
            category: 'reproductive',
            subcategory: 'female',
            question: "What are the functions of estrogen?",
            answer: "1. Development of female sex characteristics\n2. Regulation of menstrual cycle\n3. Maintenance of bone mass\n4. Development of breast tissue\n5. Preparation for pregnancy"
        },

// REPRODUCTIVE - PREGNANCY
        {
            category: 'reproductive',
            subcategory: 'pregnancy',
            question: "What hormones are involved in pregnancy and their functions?",
            answer: "1. hCG: Maintains corpus luteum\n2. Progesterone: Maintains pregnancy\n3. Estrogen: Develops breast tissue\n4. hPL: Prepares for lactation\n5. Relaxin: Softens cervix"
        },
// HYPOTHALAMUS
        {
            category: 'endocrine',
            subcategory: 'hypothalamus',
            question: "What is the function of GnRH?",
            answer: "Stimulates the anterior pituitary to release FSH and LH."
        },
        {
            category: 'endocrine',
            subcategory: 'hypothalamus',
            question: "What is the function of GHRH?",
            answer: "Stimulates the anterior pituitary to release growth hormone (GH)."
        },
        {
            category: 'endocrine',
            subcategory: 'hypothalamus',
            question: "What is the function of TRH?",
            answer: "Stimulates the anterior pituitary to release thyroid-stimulating hormone (TSH)."
        },

// ANTERIOR PITUITARY
// ... (TSH, GH, PRL, FSH, MSH, ACTH, LH already present)

// POSTERIOR PITUITARY
        {
            category: 'endocrine',
            subcategory: 'pituitary', // Keep pituitary for both anterior and posterior
            question: "What is the function of ADH (antidiuretic hormone)?",
            answer: "Regulates water balance by increasing water reabsorption in the kidneys."
        },
        {
            category: 'endocrine',
            subcategory: 'pituitary',
            question: "What is the function of oxytocin?",
            answer: "Stimulates uterine contractions during labor and milk ejection during breastfeeding."
        },

// PINEAL GLAND
        {
            category: 'endocrine',
            subcategory: 'pineal',
            question: "What is the function of melatonin?",
            answer: "Regulates circadian rhythms (sleep-wake cycles)."
        },

// THYROID GLAND
// ... (T3, T4, Calcitonin already present)

// PARATHYROID GLAND
        {
            category: 'endocrine',
            subcategory: 'parathyroid',
            question: "What is the function of parathyroid hormone (PTH)?",
            answer: "Increases blood calcium levels by stimulating bone resorption, calcium reabsorption in the kidneys, and calcium absorption in the intestines."
        },

// THYMUS
        {
            category: 'endocrine',
            subcategory: 'thymus',
            question: "What is the function of thymosin?",
            answer: "Promotes the development and maturation of T lymphocytes, which are important for immune function."
        },

// ADRENAL CORTEX
// ... (Cortisol, Aldosterone already present)

// ADRENAL MEDULLA
// ... (Epinephrine, Norepinephrine already present)

// PANCREAS
// ... (Insulin, Glucagon already present)

// OVARIES
// ... (Estrogen, Progesterone already present)

// TESTES
// ... (Testosterone already present)
// [Continue with more flashcards...]
    ];

    let currentCategory = 'all';
    let currentCardIndex = 0;
    let filteredCards = [...flashcards];

    function filterCategory(category) {
        currentCategory = category;
        filteredCards = category === 'all'
            ? [...flashcards]
            : flashcards.filter(card => card.category === category);
        currentCardIndex = 0;
        updateCard();
        updateCounter();
    }

    function flipCard(card) {
        card.classList.toggle('is-flipped');
    }

    function updateCard() {
        document.getElementById('question').textContent = filteredCards[currentCardIndex].question;
        document.getElementById('answer').textContent = filteredCards[currentCardIndex].answer;
        document.querySelector('.card').classList.remove('is-flipped');
    }

    function updateCounter() {
        document.getElementById('current').textContent = currentCardIndex + 1;
        document.getElementById('total').textContent = filteredCards.length;
    }

    function nextCard() {
        currentCardIndex = (currentCardIndex + 1) % filteredCards.length;
        updateCard();
        updateCounter();
    }

    function previousCard() {
        currentCardIndex = (currentCardIndex - 1 + filteredCards.length) % filteredCards.length;
        updateCard();
        updateCounter();
    }

    // Initialize
    updateCard();
    updateCounter();
</script>
</body>
</html>
